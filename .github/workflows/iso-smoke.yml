name: Boot smoke diagnostics

on:
  push:
    branches:
      - diagnostics/iso-smoke-20260914

jobs:
  boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nasm

      - name: Download diagnostic images
        run: |
          mkdir -p images
          curl --fail --location --compressed --output-dir images --remote-name-all \
            https://i.copy.sh/{linux.iso,linux3.iso,linux4.iso,TinyCore-11.0.iso,buildroot-bzimage68.bin,freedos722.img,windows101.img,kolibri.img,msdos.img,openbsd-floppy.img,mobius-fd-release5.img,os8.img}

      - name: Build integration-test prerequisites
        run: make build/v86-debug.wasm build/integration-test-fs/fs.json

      - name: Smoke boot linux.iso
        run: TEST_NAME="Linux" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot linux3.iso
        run: TEST_NAME="Linux 3 reboot" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot linux4.iso
        run: TEST_NAME="Linux 4" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot Tiny Core 11 as CD-ROM
        run: TEST_NAME="Tiny Core 11 CD" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot Tiny Core 11 as hard disk
        run: TEST_NAME="Tiny Core 11 HD" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot FreeDOS
        run: TEST_NAME="FreeDOS boot" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot FreeDOS with Bochs BIOS
        run: TEST_NAME="FreeDOS boot with Bochs BIOS" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot Windows 1.01
        run: TEST_NAME="Windows 1.01 boot" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot Sol OS
        run: TEST_NAME="Sol OS" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot KolibriOS
        run: TEST_NAME="KolibriOS" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot MS-DOS
        run: TEST_NAME="MS-DOS" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot MS-DOS with floppy
        run: TEST_NAME="MS-DOS (hard disk + floppy disk)" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot OpenBSD floppy
        run: TEST_NAME="OpenBSD Floppy" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot Mobius
        run: TEST_NAME="Mobius" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot Linux with Bochs BIOS
        run: TEST_NAME="Linux with Bochs BIOS" LOG_LEVEL=3 ./tests/full/run.js

      - name: Smoke boot direct bzImage
        run: TEST_NAME="Linux bzImage" LOG_LEVEL=3 ./tests/full/run.js

      - name: Apply candidate filesystem image bounds fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/browser/starter.js')
          s = p.read_text()
          old = '''                    put_on_settings.call(this, "initrd", new SyncBuffer(initrd.buffer));
                    put_on_settings.call(this, "bzimage", new SyncBuffer(bzimage.buffer));'''
          new = '''                    const initrd_buffer = initrd.buffer.slice(initrd.byteOffset, initrd.byteOffset + initrd.byteLength);
                    const bzimage_buffer = bzimage.buffer.slice(bzimage.byteOffset, bzimage.byteOffset + bzimage.byteLength);
                    put_on_settings.call(this, "initrd", new SyncBuffer(initrd_buffer));
                    put_on_settings.call(this, "bzimage", new SyncBuffer(bzimage_buffer));'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Smoke boot bzImage from filesystem with bounds fix
        run: TEST_NAME="Linux with bzImage from filesystem" LOG_LEVEL=3 ./tests/full/run.js
